    <!--
      THESIS: o portfólio dark que a categoria consagrou — roxo/violeta sobre quase-preto,
      vidro, typing caret — executado no teto de craft; recusa a versão genérica de template
      pronto: cada componente é desenhado, cada estado existe, nada é enfeite morto.
      OWN-WORLD: fundo #0a0416→#060310; superfícies #100c22 com borda branca 8%; violeta
      #8b5cf6→#a855f7 em gradiente nos CTAs e no nome; rótulos mono violeta; Sora display,
      Inter texto, JetBrains Mono para código/labels; hexágono neon como moldura de retrato.
      STORY: recrutador entende em segundos quem é EVI, vê provas (projetos filtráveis),
      percorre trajetória e formação, e age no contato — formulário funcional Web3Forms.
      FIRST VIEWPORT: header fixo com EVI+DEV (botão Baixar CV aparece quando houver CV
      em profile.resumeUrl); à esquerda badge, "Olá, eu sou EVI|" digitado com caret,
      texto, CTAs Ver projetos (sólido) e Entrar em contato (outline), sociais; à direita
      retrato em hexágono neon com chips de código flutuando.
      DESVIOS CITADOS vs comp aprovado: foto = placeholder rotulado "SUA FOTO AQUI";
      capas dos projetos = monograma em gradiente, o estado vazio projetado até a usuária
      fornecer capas reais (image em src/data/projects.ts); projetos iniciais levam selo
      "Exemplo"; newsletter omitida (controle morto); Instagram oculto sem URL; rótulos-
      kicker do comp removidos por banimento do piso de craft.
      FORM: canon da categoria escolhido pelo usuário na rodada de direção (comp aprovado
      por imagem), seed 311d17c9.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish
      review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
